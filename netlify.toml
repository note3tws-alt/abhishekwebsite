# Used when this folder is connected to Netlify through Git.
# (Zip/drag-and-drop deploys use the netlify.toml that build.py writes into the output folder.)
[build]
  command = "python3 build.py"
  publish = "out/abhishek-really-site"

# Old WordPress URLs keep working (and keep their search ranking)
[[redirects]]
  from = "/about/"
  to = "/about.html"
  status = 301
[[redirects]]
  from = "/services/"
  to = "/services.html"
  status = 301
[[redirects]]
  from = "/work.html"
  to = "/clients.html"
  status = 301
[[redirects]]
  from = "/contact/"
  to = "/contact.html"
  status = 301

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
